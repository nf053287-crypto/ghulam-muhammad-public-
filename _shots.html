<!doctype html><meta charset="utf-8">
<title>device shots</title>
<style>
  body{margin:0;background:#c9d0d8;font:11px/1.3 system-ui;padding:8px;display:flex;gap:8px;align-items:flex-start}
  figure{margin:0}
  figcaption{font-weight:700;margin:0 0 4px;color:#111}
  iframe{border:1px solid #7a8490;background:#fff;display:block}
</style>
<div id="wrap" style="display:flex;gap:8px;align-items:flex-start"></div>
<script>
// Real device-proportioned viewport: vh units resolve the way they do on a
// phone. Each frame is scrolled to a different offset so one screenshot
// captures several screenfuls of the same page.
const q = new URLSearchParams(location.search);
const PAGE = q.get('p') || 'index.html';
const W = +(q.get('w') || 375);
const H = +(q.get('h') || 812);
const N = +(q.get('n') || 5);
const START = +(q.get('s') || 0);
const wrap = document.getElementById('wrap');
const frames = [];
for (let i = 0; i < N; i++) {
  const fig = document.createElement('figure');
  const cap = document.createElement('figcaption');
  const f = document.createElement('iframe');
  f.width = W; f.height = H; f.src = PAGE;
  fig.appendChild(cap); fig.appendChild(f); wrap.appendChild(fig);
  frames.push({ f, cap, i });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  await wait(2500);
  const total = frames[0].f.contentDocument.documentElement.scrollHeight;
  for (const { f, cap, i } of frames) {
    const y = START + i * H;
    f.contentWindow.scrollTo(0, y);
    cap.textContent = `${W}x${H}  y=${y}${i === 0 ? '  (page height ' + total + ')' : ''}`;
  }
  await wait(400);
  document.title = 'PAGEHEIGHT=' + total;
})();
</script>
