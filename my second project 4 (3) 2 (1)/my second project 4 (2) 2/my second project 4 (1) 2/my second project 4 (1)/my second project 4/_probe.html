<!doctype html><meta charset="utf-8">
<style>body{font:12px/1.6 monospace;padding:10px}#f{position:fixed;right:0;bottom:0;border:0;visibility:hidden}</style>
<pre id="out">RUNNING</pre>
<iframe id="f" width="320" height="820"></iframe>
<script>
const f=document.getElementById('f'), out=document.getElementById('out');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const sel=e=>{let s=e.tagName.toLowerCase();if(e.id)s+='#'+e.id;
  if(typeof e.className==='string'&&e.className.trim())s+='.'+e.className.trim().split(/\s+/).slice(0,4).join('.');return s;};
(async()=>{
  const L=[];
  await new Promise(r=>{f.onload=r; f.src='test.html';});
  await wait(1500);
  const d=f.contentDocument, w=f.contentWindow, de=d.documentElement, cw=de.clientWidth;
  L.push(`html: scrollW=${de.scrollWidth} clientW=${cw}  body: scrollW=${d.body.scrollWidth} clientW=${d.body.clientWidth}`);
  // every element: report its own horizontal overflow contribution
  const hits=[];
  d.querySelectorAll('*').forEach(el=>{
    const c=w.getComputedStyle(el); if(c.display==='none') return;
    const b=el.getBoundingClientRect();
    if(b.width===0&&b.height===0) return;
    if(b.right>cw+0.5||b.left<-0.5) hits.push(['RECT',Math.round(b.left),Math.round(b.right),sel(el)]);
    if(el.scrollWidth>el.clientWidth+1 && el.clientWidth>0) hits.push(['SELF',el.clientWidth,el.scrollWidth,sel(el)+' ovf='+c.overflowX]);
  });
  hits.slice(0,20).forEach(h=>L.push('  '+h.join('  ')));
  if(!hits.length) L.push('  (no element)');
  // check computed container padding actually applied
  const cont=d.querySelector('.container'), row=d.querySelector('.row');
  if(cont) L.push(`\n.container padding = ${w.getComputedStyle(cont).paddingLeft} / ${w.getComputedStyle(cont).paddingRight}  width=${Math.round(cont.getBoundingClientRect().width)}`);
  if(row)  L.push(`.row margin = ${w.getComputedStyle(row).marginLeft} / ${w.getComputedStyle(row).marginRight}  width=${Math.round(row.getBoundingClientRect().width)}`);
  out.textContent='PROBE-START\n'+L.join('\n')+'\nPROBE-END';
})();
</script>
