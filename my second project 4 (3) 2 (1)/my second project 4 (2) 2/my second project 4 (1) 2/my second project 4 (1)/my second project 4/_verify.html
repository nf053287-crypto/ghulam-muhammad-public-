<!doctype html><meta charset="utf-8">
<style>body{font:12px/1.6 monospace;padding:10px}#f{position:fixed;right:0;bottom:0;border:0;visibility:hidden}</style>
<pre id="out">RUNNING</pre>
<iframe id="f" height="820"></iframe>
<script>
const f=document.getElementById('f'), out=document.getElementById('out');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const load=async (src,w)=>{
  f.style.width=w+'px';
  await new Promise(r=>{f.onload=r; f.src=src;});
  const st=f.contentDocument.createElement('style');
  st.textContent='*,*::before,*::after{transition:none !important;animation:none !important}';
  f.contentDocument.head.appendChild(st);
  await wait(500);
  return [f.contentDocument, f.contentWindow];
};
const R=(d,q)=>{const e=d.querySelector(q);return e?e.getBoundingClientRect():null;};
const dim=r=>r?`${Math.round(r.width)}x${Math.round(r.height)}`:'n/a';

(async()=>{
  const L=[];

  // 1. NAVBAR across phone widths
  L.push('== NAVBAR ==');
  for (const w of [320,360,375,390,412,430,480]) {
    const [d,win]=await load('contact.html',w);
    const h2=d.querySelector('.school-name h2');
    const cs=win.getComputedStyle(h2);
    const lines=Math.round(h2.getBoundingClientRect().height/parseFloat(cs.lineHeight));
    const de=d.documentElement;
    L.push(`  @${w}: name=${dim(R(d,'.school-name'))} font=${cs.fontSize} lines=${lines} `
      +`donate=${dim(R(d,'.navbar > .donate-btn'))} toggle=${dim(R(d,'.menu-toggle'))} `
      +`pageOverflow=${de.scrollWidth-de.clientWidth}`);
  }

  // 2. FOOTER tap targets
  L.push('\n== FOOTER LINKS (target >= 44px tall) ==');
  for (const w of [320,375,768]) {
    const [d]=await load('contact.html',w);
    const links=[...d.querySelectorAll('footer ul li a')];
    const hs=links.map(a=>Math.round(a.getBoundingClientRect().height));
    L.push(`  @${w}: n=${links.length} minHeight=${Math.min(...hs)} maxHeight=${Math.max(...hs)}`);
    const soc=[...d.querySelectorAll('.social-icons a')].map(a=>Math.round(Math.min(a.getBoundingClientRect().width,a.getBoundingClientRect().height)));
    L.push(`         social icons min side = ${Math.min(...soc)}`);
  }

  // 3. NOTICE ARROWS + home CTAs
  L.push('\n== HOME CONTROLS ==');
  for (const w of [375,768]) {
    const [d]=await load('index.html',w);
    L.push(`  @${w}: prevBtn=${dim(R(d,'#prevNoticeBtn'))} nextBtn=${dim(R(d,'#nextNoticeBtn'))} `
      +`headerDonate=${dim(R(d,'#headerDonateBtn'))}`);
  }

  // 4. FEE TABLE card mode
  L.push('\n== FEE TABLE ==');
  for (const w of [320,480,640,768]) {
    const [d,win]=await load('admissions.html',w);
    const tr=d.querySelector('.adm-table tbody tr');
    const wrap=d.querySelector('.adm-table-wrapper');
    const mode=win.getComputedStyle(tr).display==='block'?'CARDS':'table';
    L.push(`  @${w}: mode=${mode} sidewaysScrollNeeded=${wrap.scrollWidth-wrap.clientWidth}px `
      +`rowWidth=${Math.round(tr.getBoundingClientRect().width)}`);
    if (mode==='CARDS') {
      const vals=[...tr.children].map(td=>td.getAttribute('data-label')+'="'+td.textContent.trim()+'"');
      L.push(`        all 4 columns visible: ${vals.join(', ')}`);
    }
  }

  // 5. CONTACT email wrapping
  L.push('\n== CONTACT EMAIL ==');
  for (const w of [320,375,480]) {
    const [d,win]=await load('contact.html',w);
    const p=[...d.querySelectorAll('.cnt-info-item p')].find(x=>/@/.test(x.textContent));
    const strong=p.querySelector('strong');
    L.push(`  @${w}: labelDisplay=${win.getComputedStyle(strong).display} `
      +`overflowWrap=${win.getComputedStyle(p).overflowWrap} box=${dim(p.getBoundingClientRect())}`);
  }

  // 6. TEST.HTML
  L.push('\n== test.html ==');
  for (const w of [320,375,768]) {
    const [d,win]=await load('test.html',w);
    const de=d.documentElement;
    L.push(`  @${w}: pageOverflow=${de.scrollWidth-de.clientWidth} h1font=${win.getComputedStyle(d.querySelector('.hero h1')).fontSize} `
      +`containerPad=${win.getComputedStyle(d.querySelector('.container')).paddingLeft}`);
  }

  out.textContent='VERIFY-START\n'+L.join('\n')+'\nVERIFY-END';
})();
</script>
