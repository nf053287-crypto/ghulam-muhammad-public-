<!-- viewBox is cropped to the artwork (centre 130,130 · outer radius ~107) so
     the emblem optically matches logos set at the same box size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="21 21 218 218" role="img" aria-label="Taawan Foundation">
  <title>Taawan Foundation</title>

  <!-- ============================================================
       Taawan Foundation emblem
       Brand colours: green #1FA34A · navy #281752 · orange #F0662B
       Ring of joined figures = cooperation ("Taawan").
       Inside: rising sun + growing plant + open book = education.
       ============================================================ -->

  <g transform="translate(0,0)">

    <!-- Ring: six arcs, alternating green / navy -->
    <g fill="none" stroke-width="20" stroke-linecap="round">
      <path d="M151.29 44.61 A88 88 0 0 1 193.30 68.87"   stroke="#1FA34A"/>
      <path d="M214.59 105.74 A88 88 0 0 1 214.59 154.26" stroke="#281752"/>
      <path d="M193.30 191.13 A88 88 0 0 1 151.29 215.39" stroke="#1FA34A"/>
      <path d="M108.71 215.39 A88 88 0 0 1 66.70 191.13"  stroke="#281752"/>
      <path d="M45.41 154.26 A88 88 0 0 1 45.41 105.74"   stroke="#1FA34A"/>
      <path d="M66.70 68.87 A88 88 0 0 1 108.71 44.61"    stroke="#281752"/>
    </g>

    <!-- Six joined figures around the ring -->
    <circle cx="130.00" cy="42.00"  r="19" fill="#281752"/>
    <circle cx="206.21" cy="86.00"  r="19" fill="#1FA34A"/>
    <circle cx="206.21" cy="174.00" r="19" fill="#281752"/>
    <circle cx="130.00" cy="218.00" r="19" fill="#1FA34A"/>
    <circle cx="53.79"  cy="174.00" r="19" fill="#281752"/>
    <circle cx="53.79"  cy="86.00"  r="19" fill="#1FA34A"/>

    <!-- Rising sun -->
    <path d="M106 98 A24 24 0 0 1 154 98 Z" fill="#F0662B"/>

    <!-- Growing plant -->
    <path d="M130 154 C104 151 84 135 80 108 C108 109 126 127 130 154 Z" fill="#1FA34A"/>
    <path d="M130 154 C156 151 176 135 180 108 C152 109 134 127 130 154 Z" fill="#1FA34A"/>
    <path d="M126 158 L126 128 L134 128 L134 158 Z" fill="#1FA34A"/>

    <!-- Open book, plain like the reference mark. Page ruling was tried and
         dropped: it turned to grey mush at navbar size (~40px) and read as
         stray bars at full size. The silhouette carries the shape on its own,
         with a hairline gutter to separate the two pages. -->
    <path d="M127 162 C115 153 100 149 82 149 L82 185 C100 185 115 189 127 198 Z" fill="#281752"/>
    <path d="M133 162 C145 153 160 149 178 149 L178 185 C160 185 145 189 133 198 Z" fill="#281752"/>

  </g>
</svg>
